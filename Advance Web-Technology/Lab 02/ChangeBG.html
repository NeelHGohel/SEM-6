<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Change BG</title>
  </head>
  <body id="color">
    <button onclick="change()">Click</button>

    <script>
      function change() {
        document.getElementById("color").style.backgroundColor = "blue";
      }
    </script>
  </body>
</html>
