<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array Method</title>
  </head>
  <body>
    <script>
      let a = [1, 2, 3, 4, 5];
      a.push(6);
      document.writeln(a);
      a.pop();
      document.writeln(a);
    </script>
  </body>
</html>
