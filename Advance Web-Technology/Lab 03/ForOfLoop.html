<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>For Of Loop</title>
  </head>
  <body>
    <script>
      var name = ["Abc", "Rsw", "Xyz", "Jkl"];

      for (const element of name) {
        // document.write(element + "<br>");
        document.write(element + " ");
      }
    </script>
  </body>
</html>
