<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Default Parameter</title>
  </head>
  <body>
    <script>
      function add(n1, n2 = 99) {
        document.write(n1 + n2 + "<br>");
      }

      add(10, 10);
      add(1);
    </script>
  </body>
</html>
