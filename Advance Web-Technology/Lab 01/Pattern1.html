<!-- 5 4 3 2 1 
      4 3 2 1
       3 2 1
        2 1
         1  -->

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let n = 5;

      for (i = n; i >= 1; i--) {
        for (k = i; k <= n; k++) {
          document.writeln("&nbsp");
        }
        for (j = i; j >= 1; j--) {
          document.writeln(j + " ");
        }
        document.writeln("<br>");
      }
    </script>
  </body>
</html>
